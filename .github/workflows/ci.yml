name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: clarice
          POSTGRES_USER: clarice
          POSTGRES_PASSWORD: clarice
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # No sslmode -- the service container has no TLS. Matches the
      # DEBUG-branch override in clarice/settings.py, not the
      # ssl_require=True production path.
      DJANGO_DATABASE_URL: postgresql://clarice:clarice@localhost:5432/clarice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --disable-pip-version-check -r requirements-dev.txt
      # Runs BEFORE the general suite on purpose. Steps are sequential, so
      # if the broad run went first an isolation regression would fail it
      # and this step would never execute -- the named signal A3 asks for
      # would never appear. First position is what makes it unmissable.
      - name: Per-user isolation tests
        run: python src/manage.py test lists.tests.test_isolation
      - run: python src/manage.py test accounts lists capture clarice

  # A separate job because it is the only one needing both toolchains at
  # once. src/lists/static/frontend is gitignored, so the browser tests
  # have to build the bundle themselves -- a suite that silently served no
  # JavaScript would pass an empty page and prove nothing.
  #
  # No Postgres service here, unlike the django job. These cover routing,
  # static assets, session cookies and browser navigation; none of that
  # changes with the database engine, and SQLite keeps the job quick.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build the bundle the browser tests will actually load
        run: pnpm build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --disable-pip-version-check -r requirements-dev.txt
      # --with-deps installs the system libraries Chromium needs on a bare
      # runner; without it the browser downloads and then fails to launch.
      - run: python -m playwright install --with-deps chromium
      - run: python src/manage.py test functional_tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The SDK packages are not named here on purpose. compileSdk lives in
      # app/build.gradle.kts, and AGP downloads whatever that needs -- so
      # bumping it is a one-line change rather than a one-line change plus
      # a remembered edit here that nobody makes until the build breaks.
      # Accepting the licences is all this step exists to do.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      # Three targets, each catching something the others cannot:
      #
      # assembleDebug packages an APK, exercising the manifest, resources
      # and dexing -- a project that tests green and cannot be installed is
      # not one anybody can use. It is what caught a backup-rules XML file
      # that no compiler would have looked at.
      #
      # testDebugUnitTest is the JVM suite.
      #
      # assembleDebugAndroidTest only *compiles* the instrumentation tests;
      # running them needs a device, which arrives at M4. Without this they
      # would rot silently for weeks against the code they cover, and be
      # discovered broken at exactly the moment someone finally plugs a
      # phone in to check the encryption.
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
