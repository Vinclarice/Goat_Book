name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector's image, not stock postgres, and pg17 rather than 18.
        #
        # The `mind` app's migration 0002 runs `CreateExtension("vector")`, and
        # Django builds the test database by running *every* app's migrations
        # whichever labels are being tested -- so a stock image fails this job
        # in setup_databases before a single test runs, even though nothing in
        # the task core has ever heard of pgvector.
        #
        # 17 because pgvector publishes no pg18 image. Matches
        # docker-compose.yml, which had to make the same choice for the same
        # reason.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: clarice
          POSTGRES_USER: clarice
          POSTGRES_PASSWORD: clarice
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # No sslmode -- the service container has no TLS. Matches the
      # DEBUG-branch override in clarice/settings.py, not the
      # ssl_require=True production path.
      DJANGO_DATABASE_URL: postgresql://clarice:clarice@localhost:5432/clarice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --disable-pip-version-check -r requirements-dev.txt
      # Runs BEFORE the general suite on purpose. Steps are sequential, so
      # if the broad run went first an isolation regression would fail it
      # and this step would never execute -- the named signal A3 asks for
      # would never appear. First position is what makes it unmissable.
      - name: Per-user isolation tests
        run: python src/manage.py test lists.tests.test_isolation
      - run: python src/manage.py test accounts lists clarice daily routines review

  # The knowledge core, and its own runner. `requirements-dev.txt` has claimed
  # "CI runs both" since the merger and it was not true until now -- 571 tests
  # covering facets, the commitment parser, detectors and the append-only log
  # were invisible here, on the half of the application that had just moved in.
  #
  # A separate job rather than a step on `django`, because steps stop at the
  # first failure: as one job, a task-core regression would hide whatever the
  # knowledge core had to say, and the two suites are independent. This way
  # both run and both report.
  mind:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: clarice
          POSTGRES_USER: clarice
          POSTGRES_PASSWORD: clarice
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DATABASE_URL: postgresql://clarice:clarice@localhost:5432/clarice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --disable-pip-version-check -r requirements-dev.txt
      # Config lives in pytest.ini, including the testpaths that scope this to
      # src/mind -- passing the path again here would be a second place to
      # forget.
      - run: pytest

  # A separate job because it is the only one needing both toolchains at
  # once. src/lists/static/frontend is gitignored, so the browser tests
  # have to build the bundle themselves -- a suite that silently served no
  # JavaScript would pass an empty page and prove nothing.
  #
  # Postgres here too, as of August 14, 2026 -- and that reverses a decision
  # rather than correcting a mistake, so the old reasoning is worth keeping.
  #
  # This job ran on SQLite deliberately. These tests cover routing, static
  # assets, session cookies and browser navigation, none of which changes with
  # the engine, and SQLite kept the job quick. The choice was re-examined on
  # August 2, 2026 and kept: SQLite had cost a flake -- an in-memory test
  # database is unreachable from a second connection, so LiveServerTestCase
  # handed its own to the server thread and concurrent requests interleaved on
  # one cursor -- and naming the SQLite test database fixed that actual cause
  # instead, for everyone rather than only for CI. See
  # src/functional_tests/__init__.py and test_harness.py.
  #
  # What changed is not the argument but the premise. The `mind` app arrived
  # with `VectorField`, `HnswIndex`, and `GeneratedField` over `SearchVector`,
  # and Django runs every app's migrations to build a test database regardless
  # of which labels are under test. On SQLite that now dies with
  # "unrecognized token" partway through migrating -- verified by running it.
  # There is no version of this job that both keeps SQLite and has the
  # knowledge core in the repository.
  #
  # The engine-independence claim above still holds, so nothing about what
  # these tests prove has changed. They just cost a service container now.
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: clarice
          POSTGRES_USER: clarice
          POSTGRES_PASSWORD: clarice
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Stated, not inherited, which is the part of the previous fix worth
      # keeping. This job used to get its engine by saying nothing, so when
      # 17aec20 moved the DEBUG default in clarice/settings.py to the local
      # Postgres container it started dialling localhost:5433 on a runner with
      # no such service and died in setup_databases without reaching a test.
      # It stayed broken for 17 runs because the failure resembled the
      # ProjectJourneyTest breakage it had replaced.
      DJANGO_DATABASE_URL: postgresql://clarice:clarice@localhost:5432/clarice
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build the bundle the browser tests will actually load
        run: pnpm build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --disable-pip-version-check -r requirements-dev.txt
      # --with-deps installs the system libraries Chromium needs on a bare
      # runner; without it the browser downloads and then fails to launch.
      - run: python -m playwright install --with-deps chromium
      - run: python src/manage.py test functional_tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The SDK packages are not named here on purpose. compileSdk lives in
      # app/build.gradle.kts, and AGP downloads whatever that needs -- so
      # bumping it is a one-line change rather than a one-line change plus
      # a remembered edit here that nobody makes until the build breaks.
      # Accepting the licences is all this step exists to do.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      # Three targets, each catching something the others cannot:
      #
      # assembleDebug packages an APK, exercising the manifest, resources
      # and dexing -- a project that tests green and cannot be installed is
      # not one anybody can use. It is what caught a backup-rules XML file
      # that no compiler would have looked at.
      #
      # testDebugUnitTest is the JVM suite.
      #
      # assembleDebugAndroidTest only *compiles* the instrumentation tests;
      # running them needs a device, which arrives at M4. Without this they
      # would rot silently for weeks against the code they cover, and be
      # discovered broken at exactly the moment someone finally plugs a
      # phone in to check the encryption.
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
