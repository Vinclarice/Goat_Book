# Every version the build resolves, in one place. Read off the live Maven
# metadata on 2026-08-01 rather than copied from a template, so these are
# what the repositories actually served rather than what was current
# whenever some tutorial was written.
[versions]
agp = "9.3.1"
kotlin = "2.4.10"
composeBom = "2026.06.01"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
lifecycleViewmodelCompose = "2.11.0"
okhttp = "5.4.0"
coroutines = "1.11.0"
junit = "4.13.2"
json = "20260719"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
# 2.11.2 is the newest stable; 2.12.0 is at beta01 and a background delivery
# path is the last place to want a prerelease.
work = "2.11.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-work = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
# The real client is tested against a real HTTP server rather than a stub,
# so "we send the right header" is a fact rather than an assumption.
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3-junit4", version.ref = "okhttp" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# Test-only. org.json ships in the Android runtime, but the JVM unit-test
# variant is a stub whose every method throws, so parsing would fail in
# tests for a reason unrelated to the code under test. This backs it with
# the real implementation; production still uses the platform's.
json = { group = "org.json", name = "json", version.ref = "json" }
# Instrumentation only. The Keystore has no JVM implementation, so the
# encryption path can only be exercised on a device or emulator -- these
# tests compile in CI but run at M4's device pilot.
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No org.jetbrains.kotlin.android here on purpose -- AGP 9 builds Kotlin
# itself and fails the build if that plugin is also applied.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
