---
- hosts: all

  vars:
    # These defaults are correct for the only host in
    # infra/production-inventory.ini. Override on the command line if a
    # second host is ever brought up that must not claim the apex domain:
    #   --extra-vars '{"site_domain":"other.vinclarice.com","include_www_alias":false}'
    site_domain: vinclarice.com
    include_www_alias: true
    letsencrypt_email: vincentjg01@gmail.com
    # Remote database resets require both of these test-only overrides plus
    # ALLOW_REMOTE_DB_RESET=<exact-host> in the client running the tests.
    deployment_environment: production
    allow_database_flush: "0"
    # Outbound mail goes through Resend, over its HTTPS API rather than SMTP:
    # DigitalOcean drops outbound 25, 465 and 587 on every Droplet, so no mail
    # could leave this host at all. Measured August 18, 2026 --
    # design/mail-transport-plan.md carries the numbers and what it cost.
    #
    # The same ~/.resend-api-key file serves both arms; it is a bearer token
    # here and was the SMTP password before. `smtp` is still a valid value, so
    # rolling back is this variable and a redeploy.
    #
    # email_host_user is the literal string "resend" and is only read by the
    # SMTP arm -- it is not an address, and nothing a recipient sees derives
    # from it.
    email_backend: resend
    email_host_user: resend
    # Where internal signup/lockout notices land. Deliberately still a
    # personal inbox: it is the developer's, not a product address, and it
    # never appears in mail sent to a user.
    admin_email: vincentjg01@gmail.com

    # The container's environment, defined once because two tasks now need it:
    # the one-off container that migrates, and the one that serves. Ansible
    # templates a var where it is used rather than where it is written, so the
    # `secret_key`/`db_connection_url` registers below are resolved by the time
    # anything reads this -- which is what lets it sit up here at all.
    #
    # Written out twice, it would drift, and the failure would be a migration
    # running against a different database than the site serves. That is
    # exactly the class of two-places-one-policy bug the Android backup rules
    # already demonstrated.
    clarice_env:
      DJANGO_SECRET_KEY: "{{ secret_key.content | b64decode }}"
      DJANGO_ALLOWED_HOST: "{{ site_domain }}"
      DJANGO_DATABASE_URL: "{{ db_connection_url.content | b64decode }}"
      DJANGO_ENVIRONMENT: "{{ deployment_environment }}"
      ALLOW_DATABASE_FLUSH: "{{ allow_database_flush }}"
      DJANGO_EMAIL_BACKEND: "{{ email_backend }}"
      DJANGO_EMAIL_HOST_USER: "{{ email_host_user }}"
      DJANGO_EMAIL_HOST_PASSWORD: >-
        {{ (email_password.content | b64decode)
           if email_backend == 'smtp'
           else '' }}
      # The same key, named for what it is on this arm: a bearer token, not a
      # password. Trimmed, because a trailing newline in an Authorization
      # header is a 403 that looks like a bad key.
      DJANGO_RESEND_API_KEY: >-
        {{ (email_password.content | b64decode | trim)
           if email_backend == 'resend'
           else '' }}
      DJANGO_ADMIN_EMAIL: "{{ admin_email }}"
      DJANGO_SENTRY_DSN: >-
        {{ (sentry_dsn.content | b64decode | trim)
           if sentry_dsn_file.stat.exists
           else '' }}
      DJANGO_RELEASE: "{{ deployed_commit.stdout | trim }}"

  tasks:

    # First, and deliberately ahead of the apt tasks below, because those are
    # what it exists to protect.
    #
    # This host has 458MB of RAM, one core and -- until this -- no swap. On
    # August 3, 2026 the "Install nginx and certbot" task was OOM-killed
    # outright (rc 137) while `apt-mark manual docker.io` thrashed for four
    # minutes: the running container had grown by ~60MB and apt no longer had
    # room to resolve packages. The site kept serving and dpkg stayed
    # consistent, but the deploy died halfway.
    #
    # Reducing the container's footprint addressed that instance. Swap
    # addresses the class: without it, every apt run on this box is one
    # memory-hungry step away from the same failure, whatever the application
    # happens to be doing. 1GB against 4.8GB free disk, roughly twice RAM,
    # which is the usual shape for a small droplet.
    #
    # swappiness 10 rather than the default 60: this is overflow to survive a
    # spike, not somewhere to routinely page the application out to. Swapping
    # a live gunicorn worker to disk would trade an OOM for latency nobody
    # asked for.
    - name: Check whether the swapfile already exists
      ansible.builtin.stat:
        path: /swapfile
      register: swapfile

    # dd rather than fallocate: a fallocated file can be sparse, and swapon
    # refuses a swapfile with holes. This runs once, so the extra seconds
    # cost nothing.
    - name: Create the swapfile
      ansible.builtin.command:
        cmd: dd if=/dev/zero of=/swapfile bs=1M count=1024
      when: not swapfile.stat.exists
      become: true

    - name: Restrict the swapfile to root
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"
      become: true

    - name: Format the swapfile
      ansible.builtin.command:
        cmd: mkswap /swapfile
      when: not swapfile.stat.exists
      become: true

    - name: Read the active swap devices
      ansible.builtin.command:
        cmd: cat /proc/swaps
      register: active_swaps
      changed_when: false

    - name: Enable the swapfile
      ansible.builtin.command:
        cmd: swapon /swapfile
      when: "'/swapfile' not in active_swaps.stdout"
      become: true

    # Persisted separately from being enabled: a reboot would otherwise come
    # back with no swap and the failure above would return unannounced.
    - name: Keep the swapfile across reboots
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present
      become: true

    - name: Prefer RAM, keeping swap for overflow
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-clarice-swappiness.conf
        content: "vm.swappiness=10\n"
        mode: "0644"
      become: true
      register: swappiness

    - name: Apply the swappiness setting now
      ansible.builtin.command:
        cmd: sysctl -p /etc/sysctl.d/99-clarice-swappiness.conf
      when: swappiness is changed
      become: true

    - name: Install docker
      ansible.builtin.apt:
        name: docker.io
        # present, not latest. `latest` made every ordinary Clarice deploy
        # willing to upgrade the Docker daemon -- which restarts it, killing
        # the running container partway through the deploy that asked for
        # it. Upgrading Docker should be a deliberate act, not a side
        # effect of shipping a Django change. It was also why this task took
        # minutes on every run while apt resolved candidates.
        state: present
        # A day, not an hour. The refresh only earns its keep the first
        # time, when apt needs an index to find docker.io at all; once the
        # package is installed, state: present never consults the index
        # again. An hour was still short enough that any deploy on a
        # different day paid for a full re-fetch of every repository -- two
        # minutes of a small droplet reading package lists to confirm
        # something it already had installed.
        update_cache: true
        cache_valid_time: 86400
      become: true

    - name: Add our user to the docker group, so we don't need sudo/become
      ansible.builtin.user:
        name: '{{ ansible_user }}'
        groups: docker
        append: true  # don't remove any existing groups.
      become: true

    - name: Reset ssh connection to allow the user/group change to take effect
      ansible.builtin.meta: reset_connection

    # What an error report is tagged with, so an event names the deploy it
    # came from. Read here rather than baked into the image: the commit
    # being deployed is a property of this run, and burning it into a build
    # layer would mean a rebuild to correct a mislabel. --dirty is
    # deliberate -- a deploy from an unclean tree should say so in every
    # event it produces rather than claim to be the commit it isn't.
    - name: Identify the commit being deployed
      ansible.builtin.command:
        cmd: git describe --always --dirty --abbrev=12
        chdir: "{{ playbook_dir }}/.."
      register: deployed_commit
      changed_when: false
      delegate_to: 127.0.0.1

    # A tag the previous deploy's image survives under, which `-t clarice`
    # alone did not: one mutable tag means each build overwrites the only copy
    # of what was working, and undoing a bad deploy meant a full local rebuild
    # from an old checkout.
    #
    # Not `deployed_commit` above, and the difference is not cosmetic. That is
    # `git describe`, which resolves to the nearest *annotated* tag -- today
    # `ibis-8-gd8b67b38`, which is legal, and tomorrow whatever bird gets
    # tagged next. Docker tags forbid `/`, and this repository's own
    # `DEPLOYED-<date>/<time>` convention is full of them; those are lightweight
    # so `describe` ignores them, which is a property of git's defaults rather
    # than a guarantee anybody wrote down. `--match ''` matches no tag at all,
    # so `--always` falls through to the bare abbreviated SHA, which cannot
    # contain a character a tag rejects.
    - name: Compute a docker-safe tag for the image
      ansible.builtin.command:
        cmd: git describe --always --match "" --dirty --abbrev=12
        chdir: "{{ playbook_dir }}/.."
      register: image_tag
      changed_when: false
      delegate_to: 127.0.0.1

    - name: Build container image locally
      # Two tags on one build, not two builds. `clarice:current` is the moving
      # pointer the container follows; the SHA tag is what makes a previous
      # image nameable after the next deploy has moved that pointer.
      ansible.builtin.command:
        cmd: >-
          docker build --platform linux/amd64
          -t clarice:{{ image_tag.stdout | trim }}
          -t clarice:current .
        chdir: "{{ playbook_dir }}/.."
      delegate_to: 127.0.0.1

    - name: Export container image locally
      community.docker.docker_image:
        name: "clarice:{{ image_tag.stdout | trim }}"
        archive_path: /tmp/clarice-img.tar
        source: local
      delegate_to: 127.0.0.1

    - name: Upload image to server
      ansible.builtin.copy:
        src: /tmp/clarice-img.tar
        dest: /tmp/clarice-img.tar

    - name: Import container image on server
      community.docker.docker_image:
        name: "clarice:{{ image_tag.stdout | trim }}"
        load_path: /tmp/clarice-img.tar
        source: load
        force_source: true
        state: present

    # Keep a few, not all and not one. All of them fills a 25GB droplet disk
    # with images nobody will ever roll back to; one of them is where this
    # started. Four is roughly a week of deploys at the rate this moves.
    #
    # `clarice:current` is excluded by name -- it is a pointer at an image the
    # SHA tags already cover, and removing it would leave the moving tag
    # dangling. Untagged parents are left alone too: `docker image prune` is a
    # blunter instrument than this needs and would reach images other things
    # own.
    - name: Prune old images, keeping enough to roll back to
      ansible.builtin.shell:
        cmd: |
          {% raw %}
          docker images --filter 'reference=clarice'             --format '{{.Tag}}	{{.CreatedAt}}'             | grep -v '^current'             | sort -k2 -r             | tail -n +5             | cut -f1             | while read -r tag; do
                [ -n "$tag" ] && docker rmi "clarice:$tag" || true
              done
          exit 0
          {% endraw %}
      changed_when: false

    - name: Ensure .secret-key file exists
      # the intention is that this only happens once per server
      ansible.builtin.copy:
        dest: ~/.secret-key
        content: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters') }}"
        mode: 0600
        force: false  # do not recreate file if it already exists.

    - name: Read secret key back from file
      ansible.builtin.slurp:
        src: ~/.secret-key
      register: secret_key

    # Optional, unlike the secrets below it. B4 must not block a deploy:
    # if no DSN has been provisioned, the file is simply absent and
    # clarice.monitoring declines to initialise. Reporting is a thing you
    # add to a working deploy, never a thing that prevents one.
    - name: Check whether the Sentry DSN file exists
      ansible.builtin.stat:
        path: ~/.sentry-dsn
      register: sentry_dsn_file

    - name: Read Sentry DSN back from file
      ansible.builtin.slurp:
        src: ~/.sentry-dsn
      register: sentry_dsn
      when: sentry_dsn_file.stat.exists

    - name: Check whether the Resend API key file exists
      ansible.builtin.stat:
        path: ~/.resend-api-key
      register: email_password_file
      when: email_backend in ['smtp', 'resend']

    - name: Fail with instructions if the Resend API key file is missing
      ansible.builtin.fail:
        msg: >
          ~/.resend-api-key is missing on the server. Create a sending API
          key at resend.com/api-keys, then on the server run:
          umask 077 && echo -n 're_your-api-key' > ~/.resend-api-key
          The older ~/.email-app-password held a Gmail app password and is
          no longer read; delete it once this deploy succeeds.
      when: email_backend in ['smtp', 'resend'] and not email_password_file.stat.exists

    - name: Read Resend API key back from file
      ansible.builtin.slurp:
        src: ~/.resend-api-key
      register: email_password
      when: email_backend in ['smtp', 'resend']

    - name: Check whether the database connection URL file exists
      ansible.builtin.stat:
        path: ~/.db-connection-url
      register: db_connection_url_file

    - name: Fail with instructions if the database connection URL file is missing
      ansible.builtin.fail:
        msg: >
          ~/.db-connection-url is missing on the server. Provision the
          managed Postgres cluster with infra/provision-postgres.sh (run
          locally, not on the server), then on the server run:
          umask 077 && echo -n 'postgresql://user:password@host:port/clarice?sslmode=require'
          > ~/.db-connection-url
      when: not db_connection_url_file.stat.exists

    - name: Read database connection URL back from file
      ansible.builtin.slurp:
        src: ~/.db-connection-url
      register: db_connection_url

    - name: Remove legacy superlists container
      community.docker.docker_container:
        name: superlists
        state: absent

    # Before the new code serves anything, and using the *new* image.
    #
    # This used to run after the container was recreated (`docker exec clarice
    # ./manage.py migrate`), so new code answered traffic against the old
    # schema for however long the migration took -- every request in that
    # window hitting columns that did not exist yet. commercial-blueprint.md
    # Part 1, "also, cheaply".
    #
    # Swapping the two tasks would not have worked, and the reason is worth
    # stating: the old container runs the old code, which does not contain the
    # new migrations. Migrating early has to mean a *one-off container from the
    # new image*, which is what this is.
    #
    # A different name and no port binding, because the container being
    # replaced is still running and still holds 127.0.0.1:8000.
    #
    # `detach: false` waits for it and fails the task on a non-zero exit, so a
    # broken migration now stops the deploy *here* -- with the old container
    # still serving the schema it was built for, which is the whole point.
    # `cleanup` only removes it on success, so a failure leaves the container
    # to be inspected.
    - name: Migrate, before the new code starts serving
      community.docker.docker_container:
        name: clarice-migrate
        image: "clarice:{{ image_tag.stdout | trim }}"
        command: ./manage.py migrate
        state: started
        detach: false
        cleanup: true
        # `cleanup` only removes it on success, so a failed migration leaves
        # this container behind to be inspected -- and the next run must not
        # quietly restart that corpse and report its old exit status as this
        # deploy's result.
        recreate: true
        # Without this the module returns no output at all, and a data
        # migration's own printout is sometimes the only record of what it
        # did -- see the note under "Show what the migrations did".
        output_logs: true
        env: "{{ clarice_env }}"
      register: migration_output

    # Registered and printed because a data migration's own output is
    # sometimes the only record of what it did. The container is removed the
    # moment it succeeds, so `docker logs` is not available afterwards and
    # this is the only place the text survives.
    #
    # That cost a real answer on August 3, 2026: release D's deploy ran
    # 0026 (converts each subtask, deleting the Item it came from) and 0028
    # (deletes every ownerless area, irreversibly). Both were written to
    # print their counts precisely so production would be the evidence, and
    # both printed into nothing. 0026's figure was recoverable by counting
    # rows afterwards; 0028's is gone for good.
    - name: Show what the migrations did
      ansible.builtin.debug:
        var: migration_output.container.Output

    - name: Run container
      community.docker.docker_container:
        name: clarice
        image: "clarice:{{ image_tag.stdout | trim }}"
        state: started
        recreate: true
        # Docker's default is `no`, which means a reboot, an OOM kill or a
        # resize leaves the site down until somebody personally notices and
        # intervenes. That is not hypothetical: resizing the droplet on
        # August 14, 2026 brought nginx back on its own (systemd) and left this
        # container stopped, so the site answered 502 until it was started by
        # hand. Sentry saw nothing, because Sentry reports errors from a
        # *running* application and a dead one produces none.
        #
        # `unless-stopped` rather than `always`, so that a deliberate
        # `docker stop` during an incident stays stopped rather than fighting
        # whoever stopped it.
        #
        # Note this only takes effect from the next deploy, since a restart
        # policy is fixed when the container is created. An already-running
        # container needs `docker update --restart=unless-stopped <name>`.
        restart_policy: unless-stopped
        # Shared with the migration container above; see `clarice_env` in the
        # play vars for why it is not written out here.
        env: "{{ clarice_env }}"
        ports:
          - "127.0.0.1:8000:8888"
      # Recreating here, before nginx is installed/reloaded, matters: on a
      # server that was previously deployed with the old 80:8888 port
      # mapping, the old container is still squatting on host port 80 until
      # this task replaces it. If nginx tries to bind :80 first, it fails
      # with "control process exited with error code" because the port's
      # still taken.

    # The same failure as the digest below, found a fortnight later and in the
    # half of the application that most depended on it. Concept extraction and
    # connection detection have been management commands since the knowledge
    # core arrived, and nothing invoked them -- so on the live site a note was
    # stored, indexed and date-parsed, and then never looked at again. Every
    # detector: built, tested, green, and switched off.
    #
    # 03:20 rather than on the hour, because it shares a small droplet with the
    # hourly digest and there is no reason for the two to contend. Nightly
    # rather than hourly because these read the whole recent corpus per person,
    # and nothing here is time-sensitive -- a connection surfacing tomorrow
    # morning instead of within the hour is the same connection.
    #
    # No --owner: the command covers everybody with notes, so an account created
    # tomorrow is maintained without anybody remembering to add a line here.
    - name: Schedule the knowledge core's extraction and detection pass
      ansible.builtin.cron:
        name: clarice-mind-maintenance
        minute: "20"
        hour: "3"
        job: docker exec clarice ./manage.py run_mind_maintenance
        user: root
      # Writing root's crontab needs root -- the same omission the digest task
      # below already documents, made again directly above its explanation.
      # `user: root` alone makes the module run `crontab -u root` as the deploy
      # user, which is refused with "must be privileged to use -u". A cron task
      # cannot be checked by --syntax-check or --list-tasks; only a real run
      # finds this, which is exactly what the note below says happened last time.
      become: true

    # The command has existed and worked for a while but nothing invoked it,
    # so the digest reached nobody. Users with nothing to report are skipped
    # by the command itself, so a quiet day stays quiet.
    - name: Schedule the due-task digest
      ansible.builtin.cron:
        name: clarice-due-digest
        minute: "0"
        hour: "*"
        job: docker exec clarice ./manage.py send_due_digest
        user: root
      # Hourly, and deliberately not pinned to any hour: users are in
      # different time zones, so a single daily run can only ever be
      # somebody's morning -- and this entry used to say hour 7 while cron
      # ran in the server's UTC, delivering at 03:00 Eastern. The command
      # now decides per recipient (07:00 local, once per their day), which
      # takes the server's own zone out of the picture rather than
      # requiring it to be configured correctly.
      # Writing *root's* crontab needs root: without this the module runs
      # `crontab -u root` as the deploy user and is refused. Every other
      # task here that touches something outside the deploy user's home
      # already had it; this one was written but never executed, so the
      # omission survived until the first real run.
      become: true

    # The evening half of the same idea, and off by default -- nobody receives
    # this who has not asked for it, which is what `/privacy/` says in
    # published text. Hourly for the same reason as the digest above: the
    # command decides whose evening it is, so the server's own zone stays out
    # of it. Nothing is sent once somebody has written the day.
    - name: Schedule the evening closing nudge
      ansible.builtin.cron:
        name: clarice-closing-nudge
        minute: "5"
        hour: "*"
        job: docker exec clarice ./manage.py send_closing_nudge
        user: root
      # Five past, not on the hour: two `docker exec`s into the same container
      # at the same instant is a contention nobody needs, and the window is
      # hours wide so the offset costs nothing.
      become: true

    # Erases accounts whose 30-day grace period has run out. Requesting deletion
    # writes a timestamp and nothing else; this is what eventually makes it
    # true, so an account only actually leaves if this runs.
    #
    # Daily, at an hour of its own. It is not time-sensitive to the minute -- a
    # purge landing at 04:40 instead of 04:00 is the same purge -- but it must
    # not miss a day silently, which is why the command prints a count even when
    # that count is zero.
    #
    # No --owner and no arguments: `due_for_purge` decides, from the timestamp,
    # so a request made tomorrow is honoured without anybody editing this file.
    - name: Schedule the account-erasure sweep
      ansible.builtin.cron:
        name: clarice-purge-deleted-accounts
        minute: "40"
        hour: "4"
        job: docker exec clarice ./manage.py purge_deleted_accounts
        user: root
      # Writing root's crontab needs root -- the same reason the two tasks above
      # both document, one of them after being caught by a real run.
      become: true

    - name: Install nginx and certbot
      ansible.builtin.apt:
        name:
          - nginx
          - python3-certbot-nginx
        state: present
        update_cache: true
      become: true

    - name: Ensure ACME challenge directory exists
      ansible.builtin.file:
        path: /var/www/certbot
        state: directory
        owner: root
        group: www-data
        mode: 0755
      become: true

    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      become: true
      notify: reload nginx

    - name: Remove legacy superlists nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/superlists
        state: absent
      become: true
      notify: reload nginx

    - name: Check whether the TLS certificate already exists
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ site_domain }}/fullchain.pem"
      register: tls_certificate
      become: true

    - name: Install initial nginx config
      ansible.builtin.template:
        src: >-
          {{ 'templates/nginx-clarice.conf.j2'
             if tls_certificate.stat.exists
             else 'templates/nginx-clarice-bootstrap.conf.j2' }}
        dest: /etc/nginx/sites-available/clarice
        mode: 0644
      become: true
      notify: reload nginx

    - name: Enable the site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/clarice
        dest: /etc/nginx/sites-enabled/clarice
        state: link
      become: true
      notify: reload nginx

    - name: Check whether nginx is managed by systemd
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      register: nginx_service_state
      changed_when: false
      failed_when: false
      become: true

    - name: Gracefully stop an orphaned nginx master process
      ansible.builtin.command:
        argv:
          - /usr/bin/pkill
          - --signal
          - QUIT
          - --full
          - "^nginx: master process"
      register: orphaned_nginx_stop
      changed_when: orphaned_nginx_stop.rc == 0
      failed_when: orphaned_nginx_stop.rc not in [0, 1]
      when: nginx_service_state.stdout != 'active'
      become: true

    - name: Wait for orphaned nginx listeners to close
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        state: stopped
        timeout: 15
      loop:
        - 80
        - 443
      when: orphaned_nginx_stop is changed

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      become: true

    - name: Flush handlers so nginx can serve the ACME challenge
      ansible.builtin.meta: flush_handlers

    - name: Obtain or renew the Let's Encrypt certificate
      ansible.builtin.command:
        cmd: >
          certbot certonly --webroot
          --webroot-path /var/www/certbot
          --cert-name {{ site_domain }}
          -d {{ site_domain }}{% if include_www_alias | bool %} -d www.{{ site_domain }}{% endif %}
          --non-interactive --agree-tos -m {{ letsencrypt_email }}
          --keep-until-expiring
      register: certbot_result
      changed_when: "'not yet due for renewal' not in certbot_result.stdout"
      become: true
      notify: reload nginx

    - name: Ensure certificate renewal hook directory exists
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal-hooks/deploy
        state: directory
        mode: 0755
      become: true

    - name: Reload nginx after certificate renewal
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
        content: |
          #!/bin/sh
          systemctl reload nginx
        owner: root
        group: root
        mode: 0755
      become: true

    - name: Install the complete HTTPS reverse-proxy config
      ansible.builtin.template:
        src: templates/nginx-clarice.conf.j2
        dest: /etc/nginx/sites-available/clarice
        mode: 0644
      become: true
      notify: reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false
      become: true

    - name: Apply the validated HTTPS configuration
      ansible.builtin.meta: flush_handlers

    - name: Ensure automatic certificate renewal is enabled
      ansible.builtin.service:
        name: certbot.timer
        state: started
        enabled: true
      become: true

  handlers:
    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      become: true
