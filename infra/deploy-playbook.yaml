---
- hosts: all

  vars:
    # These defaults are correct for the only host in
    # infra/production-inventory.ini. Override on the command line if a
    # second host is ever brought up that must not claim the apex domain:
    #   --extra-vars '{"site_domain":"other.vinclarice.com","include_www_alias":false}'
    site_domain: vinclarice.com
    include_www_alias: true
    letsencrypt_email: vincentjg01@gmail.com
    # Remote database resets require both of these test-only overrides plus
    # ALLOW_REMOTE_DB_RESET=<exact-host> in the client running the tests.
    deployment_environment: production
    allow_database_flush: "0"
    # Outbound mail goes through Resend, whose SMTP username is the literal
    # string "resend" -- it is not an address, and nothing a recipient sees
    # is derived from it. The API key that serves as its password lives in
    # ~/.resend-api-key on the server (see the task below) rather than here,
    # since it shouldn't be committed or passed on the CLI.
    email_backend: smtp
    email_host_user: resend
    # Where internal signup/lockout notices land. Deliberately still a
    # personal inbox: it is the developer's, not a product address, and it
    # never appears in mail sent to a user.
    admin_email: vincentjg01@gmail.com

  tasks:

    - name: Install docker
      ansible.builtin.apt:
        name: docker.io
        # present, not latest. `latest` made every ordinary Clarice deploy
        # willing to upgrade the Docker daemon -- which restarts it, killing
        # the running container partway through the deploy that asked for
        # it. Upgrading Docker should be a deliberate act, not a side
        # effect of shipping a Django change. It was also why this task took
        # minutes on every run while apt resolved candidates.
        state: present
        # A day, not an hour. The refresh only earns its keep the first
        # time, when apt needs an index to find docker.io at all; once the
        # package is installed, state: present never consults the index
        # again. An hour was still short enough that any deploy on a
        # different day paid for a full re-fetch of every repository -- two
        # minutes of a small droplet reading package lists to confirm
        # something it already had installed.
        update_cache: true
        cache_valid_time: 86400
      become: true

    - name: Add our user to the docker group, so we don't need sudo/become
      ansible.builtin.user:
        name: '{{ ansible_user }}'
        groups: docker
        append: true  # don't remove any existing groups.
      become: true

    - name: Reset ssh connection to allow the user/group change to take effect
      ansible.builtin.meta: reset_connection

    # What an error report is tagged with, so an event names the deploy it
    # came from. Read here rather than baked into the image: the commit
    # being deployed is a property of this run, and burning it into a build
    # layer would mean a rebuild to correct a mislabel. --dirty is
    # deliberate -- a deploy from an unclean tree should say so in every
    # event it produces rather than claim to be the commit it isn't.
    - name: Identify the commit being deployed
      ansible.builtin.command:
        cmd: git describe --always --dirty --abbrev=12
        chdir: "{{ playbook_dir }}/.."
      register: deployed_commit
      changed_when: false
      delegate_to: 127.0.0.1

    - name: Build container image locally
      ansible.builtin.command:
        cmd: docker build --platform linux/amd64 -t clarice .
        chdir: "{{ playbook_dir }}/.."
      delegate_to: 127.0.0.1

    - name: Export container image locally
      community.docker.docker_image:
        name: clarice
        archive_path: /tmp/clarice-img.tar
        source: local
      delegate_to: 127.0.0.1

    - name: Upload image to server
      ansible.builtin.copy:
        src: /tmp/clarice-img.tar
        dest: /tmp/clarice-img.tar

    - name: Import container image on server
      community.docker.docker_image:
        name: clarice
        load_path: /tmp/clarice-img.tar
        source: load
        force_source: true
        state: present

    - name: Ensure .secret-key file exists
      # the intention is that this only happens once per server
      ansible.builtin.copy:
        dest: ~/.secret-key
        content: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters') }}"
        mode: 0600
        force: false  # do not recreate file if it already exists.

    - name: Read secret key back from file
      ansible.builtin.slurp:
        src: ~/.secret-key
      register: secret_key

    # Optional, unlike the secrets below it. B4 must not block a deploy:
    # if no DSN has been provisioned, the file is simply absent and
    # clarice.monitoring declines to initialise. Reporting is a thing you
    # add to a working deploy, never a thing that prevents one.
    - name: Check whether the Sentry DSN file exists
      ansible.builtin.stat:
        path: ~/.sentry-dsn
      register: sentry_dsn_file

    - name: Read Sentry DSN back from file
      ansible.builtin.slurp:
        src: ~/.sentry-dsn
      register: sentry_dsn
      when: sentry_dsn_file.stat.exists

    - name: Check whether the Resend API key file exists
      ansible.builtin.stat:
        path: ~/.resend-api-key
      register: email_password_file
      when: email_backend == 'smtp'

    - name: Fail with instructions if the Resend API key file is missing
      ansible.builtin.fail:
        msg: >
          ~/.resend-api-key is missing on the server. Create a sending API
          key at resend.com/api-keys, then on the server run:
          umask 077 && echo -n 're_your-api-key' > ~/.resend-api-key
          The older ~/.email-app-password held a Gmail app password and is
          no longer read; delete it once this deploy succeeds.
      when: email_backend == 'smtp' and not email_password_file.stat.exists

    - name: Read Resend API key back from file
      ansible.builtin.slurp:
        src: ~/.resend-api-key
      register: email_password
      when: email_backend == 'smtp'

    - name: Check whether the database connection URL file exists
      ansible.builtin.stat:
        path: ~/.db-connection-url
      register: db_connection_url_file

    - name: Fail with instructions if the database connection URL file is missing
      ansible.builtin.fail:
        msg: >
          ~/.db-connection-url is missing on the server. Provision the
          managed Postgres cluster with infra/provision-postgres.sh (run
          locally, not on the server), then on the server run:
          umask 077 && echo -n 'postgresql://user:password@host:port/clarice?sslmode=require'
          > ~/.db-connection-url
      when: not db_connection_url_file.stat.exists

    - name: Read database connection URL back from file
      ansible.builtin.slurp:
        src: ~/.db-connection-url
      register: db_connection_url

    - name: Remove legacy superlists container
      community.docker.docker_container:
        name: superlists
        state: absent

    - name: Run container
      community.docker.docker_container:
        name: clarice
        image: clarice
        state: started
        recreate: true
        env:
          DJANGO_SECRET_KEY: "{{ secret_key.content | b64decode }}"
          DJANGO_ALLOWED_HOST: "{{ site_domain }}"
          DJANGO_DATABASE_URL: "{{ db_connection_url.content | b64decode }}"
          DJANGO_ENVIRONMENT: "{{ deployment_environment }}"
          ALLOW_DATABASE_FLUSH: "{{ allow_database_flush }}"
          DJANGO_EMAIL_BACKEND: "{{ email_backend }}"
          DJANGO_EMAIL_HOST_USER: "{{ email_host_user }}"
          DJANGO_EMAIL_HOST_PASSWORD: >-
            {{ (email_password.content | b64decode)
               if email_backend == 'smtp'
               else '' }}
          DJANGO_ADMIN_EMAIL: "{{ admin_email }}"
          DJANGO_SENTRY_DSN: >-
            {{ (sentry_dsn.content | b64decode | trim)
               if sentry_dsn_file.stat.exists
               else '' }}
          DJANGO_RELEASE: "{{ deployed_commit.stdout | trim }}"
        ports:
          - "127.0.0.1:8000:8888"
      # Recreating here, before nginx is installed/reloaded, matters: on a
      # server that was previously deployed with the old 80:8888 port
      # mapping, the old container is still squatting on host port 80 until
      # this task replaces it. If nginx tries to bind :80 first, it fails
      # with "control process exited with error code" because the port's
      # still taken.

    - name: Run migration inside container
      community.docker.docker_container_exec:
        container: clarice
        command: ./manage.py migrate
      register: migration_output

    # Registered and printed because a data migration's own output is
    # sometimes the only record of what it did. docker_container_exec
    # captures stdout into the result rather than sending it to the
    # container's logs, so without these two tasks Ansible discards it and
    # `docker logs clarice` never had it either.
    #
    # That cost a real answer on August 3, 2026: release D's deploy ran
    # 0026 (converts each subtask, deleting the Item it came from) and 0028
    # (deletes every ownerless area, irreversibly). Both were written to
    # print their counts precisely so production would be the evidence, and
    # both printed into nothing. 0026's figure was recoverable by counting
    # rows afterwards; 0028's is gone for good.
    - name: Show what the migrations did
      ansible.builtin.debug:
        var: migration_output.stdout_lines

    # The command has existed and worked for a while but nothing invoked it,
    # so the digest reached nobody. Users with nothing to report are skipped
    # by the command itself, so a quiet day stays quiet.
    - name: Schedule the due-task digest
      ansible.builtin.cron:
        name: clarice-due-digest
        minute: "0"
        hour: "*"
        job: docker exec clarice ./manage.py send_due_digest
        user: root
      # Hourly, and deliberately not pinned to any hour: users are in
      # different time zones, so a single daily run can only ever be
      # somebody's morning -- and this entry used to say hour 7 while cron
      # ran in the server's UTC, delivering at 03:00 Eastern. The command
      # now decides per recipient (07:00 local, once per their day), which
      # takes the server's own zone out of the picture rather than
      # requiring it to be configured correctly.
      # Writing *root's* crontab needs root: without this the module runs
      # `crontab -u root` as the deploy user and is refused. Every other
      # task here that touches something outside the deploy user's home
      # already had it; this one was written but never executed, so the
      # omission survived until the first real run.
      become: true

    - name: Install nginx and certbot
      ansible.builtin.apt:
        name:
          - nginx
          - python3-certbot-nginx
        state: present
        update_cache: true
      become: true

    - name: Ensure ACME challenge directory exists
      ansible.builtin.file:
        path: /var/www/certbot
        state: directory
        owner: root
        group: www-data
        mode: 0755
      become: true

    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      become: true
      notify: reload nginx

    - name: Remove legacy superlists nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/superlists
        state: absent
      become: true
      notify: reload nginx

    - name: Check whether the TLS certificate already exists
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ site_domain }}/fullchain.pem"
      register: tls_certificate
      become: true

    - name: Install initial nginx config
      ansible.builtin.template:
        src: >-
          {{ 'templates/nginx-clarice.conf.j2'
             if tls_certificate.stat.exists
             else 'templates/nginx-clarice-bootstrap.conf.j2' }}
        dest: /etc/nginx/sites-available/clarice
        mode: 0644
      become: true
      notify: reload nginx

    - name: Enable the site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/clarice
        dest: /etc/nginx/sites-enabled/clarice
        state: link
      become: true
      notify: reload nginx

    - name: Check whether nginx is managed by systemd
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      register: nginx_service_state
      changed_when: false
      failed_when: false
      become: true

    - name: Gracefully stop an orphaned nginx master process
      ansible.builtin.command:
        argv:
          - /usr/bin/pkill
          - --signal
          - QUIT
          - --full
          - "^nginx: master process"
      register: orphaned_nginx_stop
      changed_when: orphaned_nginx_stop.rc == 0
      failed_when: orphaned_nginx_stop.rc not in [0, 1]
      when: nginx_service_state.stdout != 'active'
      become: true

    - name: Wait for orphaned nginx listeners to close
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        state: stopped
        timeout: 15
      loop:
        - 80
        - 443
      when: orphaned_nginx_stop is changed

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      become: true

    - name: Flush handlers so nginx can serve the ACME challenge
      ansible.builtin.meta: flush_handlers

    - name: Obtain or renew the Let's Encrypt certificate
      ansible.builtin.command:
        cmd: >
          certbot certonly --webroot
          --webroot-path /var/www/certbot
          --cert-name {{ site_domain }}
          -d {{ site_domain }}{% if include_www_alias | bool %} -d www.{{ site_domain }}{% endif %}
          --non-interactive --agree-tos -m {{ letsencrypt_email }}
          --keep-until-expiring
      register: certbot_result
      changed_when: "'not yet due for renewal' not in certbot_result.stdout"
      become: true
      notify: reload nginx

    - name: Ensure certificate renewal hook directory exists
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal-hooks/deploy
        state: directory
        mode: 0755
      become: true

    - name: Reload nginx after certificate renewal
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
        content: |
          #!/bin/sh
          systemctl reload nginx
        owner: root
        group: root
        mode: 0755
      become: true

    - name: Install the complete HTTPS reverse-proxy config
      ansible.builtin.template:
        src: templates/nginx-clarice.conf.j2
        dest: /etc/nginx/sites-available/clarice
        mode: 0644
      become: true
      notify: reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false
      become: true

    - name: Apply the validated HTTPS configuration
      ansible.builtin.meta: flush_handlers

    - name: Ensure automatic certificate renewal is enabled
      ansible.builtin.service:
        name: certbot.timer
        state: started
        enabled: true
      become: true

  handlers:
    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      become: true
