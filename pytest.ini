# The `mind` app only. The task core runs on `manage.py test` and stays there:
# converting these to Django's TestCase would be a large mechanical rewrite of
# the thing in that app most worth leaving alone, and the two runners cost
# nothing to keep side by side.
#
# The count was written here as 521 and is 1132 as of August 26, 2026 -- so the
# argument got stronger while the number went stale, which is why the number is
# gone rather than corrected. `design/README.md`: a header may state a decision,
# never a tally.
#
# **Reading the result takes care.** Under redirection this suite prints its
# progress to 100% and then no summary line at all -- no "N passed", nothing.
# Dots to the end look identical to a run that died quietly. Read the exit code,
# and when you want a real count, ask for it rather than inferring it:
#
#   python -m pytest --junitxml=<path>   # <path> must be a Windows path;
#                                        # Git Bash's /tmp does not exist to it
[pytest]
DJANGO_SETTINGS_MODULE = clarice.settings
pythonpath = src
testpaths = src/mind
python_files = test_*.py
addopts = -q --strict-markers
