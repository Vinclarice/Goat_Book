# The `mind` app only. The task core runs on `manage.py test` and stays there:
# converting 521 pytest-style tests to Django's TestCase would be a large
# mechanical rewrite of the thing in that app most worth leaving alone, and the
# two runners cost nothing to keep side by side.
[pytest]
DJANGO_SETTINGS_MODULE = clarice.settings
pythonpath = src
testpaths = src/mind
python_files = test_*.py
addopts = -q --strict-markers
