{% extends "base.html" %}

{% block title %}Send a new confirmation link · Clarice{% endblock %}

{% block content %}
  <section class="mx-auto max-w-md py-10">
    <div class="rounded-sm border border-border bg-card p-6 sm:p-8 space-y-5">
      <h1 class="font-sans text-2xl font-bold tracking-tight">Send a new link</h1>
      <p class="text-muted-foreground">
        Type the address you signed up with and we'll send another confirmation
        link.
      </p>
      <form method="post" action="{% url 'resend_activation' %}" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-1">
          <label class="text-sm font-semibold" for="resend-email">Email address</label>
          <input
            id="resend-email"
            class="min-h-11 w-full rounded-sm border border-border-strong bg-input px-3 text-foreground outline-none"
            type="email"
            name="email"
            autocomplete="email"
            required
          >
        </div>
        <button
          class="touch-target w-full min-h-11 rounded-sm border border-text bg-text font-sans text-sm font-semibold text-bg transition-colors hover:bg-transparent hover:text-text"
          type="submit"
        >Send the link</button>
      </form>
    </div>
  </section>
{% endblock %}
