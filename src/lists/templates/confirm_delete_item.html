{% extends "base.html" %}

{% block title %}Delete archived task · Superlists{% endblock %}

{% block content %}
  <section class="auth-page">
    <div class="auth-card auth-card-wide delete-confirmation">
      <div class="auth-heading">
        <p class="eyebrow">Permanent action</p>
        <h1>Delete this task?</h1>
        <p>
          “{{ item.text }}” will be permanently removed from
          <strong>{{ item.list.title }}</strong>. This cannot be undone.
        </p>
      </div>

      <div class="confirmation-actions">
        <a class="btn btn-outline-light" href="{% url 'dashboard' %}#task-archive">
          Keep task
        </a>
        <form method="post" action="{% url 'delete_archived_item' item.id %}">
          {% csrf_token %}
          <button class="btn btn-danger" type="submit">Delete permanently</button>
        </form>
      </div>
    </div>
  </section>
{% endblock %}
