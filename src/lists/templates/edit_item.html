{% extends "base.html" %}

{% block title %}Edit task · Superlists{% endblock %}

{% block content %}
  <section class="auth-page">
    <div class="auth-card auth-card-wide">
      <div class="auth-heading">
        <p class="eyebrow">{{ item.list.title }}</p>
        <h1>Edit task</h1>
        <p>Update the wording without changing its completion state.</p>
      </div>

      <form method="post" action="{% url 'edit_item' item.id %}" class="auth-form">
        {% csrf_token %}
        <div>
          <label for="id_text">Task</label>
          <input
            id="id_text"
            name="text"
            value="{{ form.text.value|default:item.text }}"
            required
            autofocus
          >
          {% if form.text.errors %}
            <div class="field-error">{{ form.text.errors.0 }}</div>
          {% endif %}
        </div>
        <button class="btn btn-primary" type="submit">Save task</button>
      </form>

      <p class="auth-switch">
        <a href="{{ item.list.get_absolute_url }}">Cancel</a>
      </p>
    </div>
  </section>
{% endblock %}
