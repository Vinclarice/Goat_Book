<form method="post" action="{{ form_action }}" class="add-item-form">
  {% csrf_token %}
  <label for="id_text">Add another item</label>
  <div class="input-group input-group-lg">
    <input
      id="id_text"
      name="text"
      class="form-control {% if form.errors %}is-invalid{% endif %}"
      placeholder="What is next?"
      value="{{ form.text.value|default:'' }}"
      aria-describedby="id_text_feedback"
      required
    >
    <button class="btn btn-primary" type="submit">Add item</button>
    {% if form.errors %}
      <div id="id_text_feedback" class="invalid-feedback">
        {{ form.errors.text.0 }}
      </div>
    {% endif %}
  </div>
</form>
