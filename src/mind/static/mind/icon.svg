<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Second Mind">
  <!-- Two marks and the line between them: the whole product in one glyph. Deliberately
       not a brain or a lightbulb — the idea is the connection, not the thinking. -->
  <rect width="512" height="512" rx="112" fill="#2f5d50"/>
  <g stroke="#f4f1ea" stroke-linecap="round" fill="none">
    <path d="M168 344 C 208 240, 304 272, 344 168" stroke-width="18" opacity="0.55"/>
  </g>
  <circle cx="168" cy="344" r="46" fill="#f4f1ea"/>
  <circle cx="344" cy="168" r="30" fill="#f4f1ea" opacity="0.75"/>
</svg>
